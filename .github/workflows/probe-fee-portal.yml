name: Probe the fee portal

# Stage 12a-1. A one-time look at the official Fees Regulating Authority fee search page (ay26-27.mahafraportal.org).
# It sends at most 3 requests (robots.txt, the page, ONE test search for Mumbai-City engineering), obeys robots.txt, stops at any login or CAPTCHA
# and never bypasses anything. It saves what it saw in data/raw/fees-probe/ so the real fee reader can be written on facts. Run by hand only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-fee-portal
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "Self-tests (offline, no website is contacted)"
        run: python -m unittest tests/test_stage12a1.py

      - name: "Probe the fee page (polite, robots.txt obeyed)"
        run: python -m ingestion.fra_probe

      - name: "Save what the probe saw in the repository"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/fees-probe
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Fee portal probe result"
            git pull --rebase origin main
            git push
          fi
