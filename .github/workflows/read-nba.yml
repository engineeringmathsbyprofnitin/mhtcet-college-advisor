name: Read the NBA lists

# Stage 12b-2. Reads the NBA accredited-programs Excel lists that the SITE OWNER downloaded by hand from www.nbaind.org (the site answers our
# robot with HTTP 403, so nothing is fetched automatically and nothing is bypassed). The files and one line each in sources.csv are in
# data/manual/nba/. data/normalized/nba is replaced ONLY if every listed file was read completely without problem; otherwise the previous data stays.
# Stage 12b-3c: after the NBA data is replaced, the link steps run too: NBA institutions -> website colleges (nba_match), NBA programs -> branches (nba_branch_match),
# and the website's accreditation table (build_accreditation). Institutions or name pairs that still wait for the owner stay UNLINKED (see data/normalized/nba_link/*report.json);
# the owner answers go in data/manual/nba_institution_confirmations.csv and data/manual/nba_program_rules.csv. Publishing to the website is still done by "Publish website data".
# Runs by hand (Actions tab -> this workflow -> Run workflow) and whenever something in data/manual/nba or the two owner answer files changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/manual/nba/**"
      - "data/manual/nba_institution_confirmations.csv"
      - "data/manual/nba_program_rules.csv"

permissions:
  contents: write

concurrency:
  group: read-nba
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "Self-tests (offline)"
        run: python -m unittest tests/test_stage12b2.py

      - name: "Read the NBA lists"
        run: python -m ingestion.nba_import

      - name: "Replace the NBA data (only because the step above succeeded)"
        if: success()
        run: |
          rm -rf data/normalized/nba
          mkdir -p data/normalized
          cp -r build/normalized/nba data/normalized/

      - name: "Link the NBA data to the website's colleges and branches"
        if: success()
        run: |
          python -m ingestion.nba_match
          python -m ingestion.nba_branch_match
          python -m ingestion.build_accreditation

      - name: "Save the NBA data in the repository"
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/nba data/normalized/nba_link data/normalized/tables/accreditation.csv data/normalized/tables/accreditation_sources.csv data/normalized/tables/accreditation_build_report.json
          if git diff --cached --quiet; then
            echo "NBA data unchanged."
          else
            git commit -m "Update NBA tables"
            git pull --rebase origin main
            git push
          fi
