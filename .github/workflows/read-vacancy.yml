name: Read the vacancy lists

# Reads the archived CAP vacancy position (Round IV = seats open going into Round IV; Round III only if there is no Round IV)
# into small tables (Stage 11b). Built in a temporary folder; data/normalized/vacancy is replaced ONLY if every file was read
# completely with no problem, otherwise the previous data is kept.
# Run by hand: Actions tab -> this workflow -> Run workflow. Also runs weekly, after the other reading jobs.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 5 * * 1"        # Mondays 05:07 UTC

permissions:
  contents: write              # saves the vacancy tables into the repository

concurrency:
  group: read-documents        # same group as the cutoff reading job, so the two never save at the same moment
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "Install the PDF tool (poppler)"
        run: command -v pdftotext > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: "Self-tests (offline)"
        run: python -m unittest tests/test_stage11a.py tests/test_stage11b.py

      - name: "Fetch the archived vacancy PDFs from the releases"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/raw/files
          python -m ingestion.read_vacancy needed --manifest data/raw/manifest.json > needed_vacancy.txt
          test -s needed_vacancy.txt || { echo "FAIL: no archived Round IV or Round III vacancy file is listed in the manifest"; exit 1; }
          while IFS='|' read -r tag asset sha; do
            [ -z "$tag" ] && continue
            gh release download "$tag" --pattern "$asset" --dir data/raw/files --clobber
          done < needed_vacancy.txt
          echo "Fetched $(wc -l < needed_vacancy.txt) file(s)"

      - name: "Read the vacancy lists"
        run: python -m ingestion.read_vacancy read --manifest data/raw/manifest.json --files data/raw/files --out build/normalized/vacancy

      - name: "Replace the vacancy data (only because the step above succeeded)"
        if: success()
        run: |
          rm -rf data/normalized/vacancy
          mkdir -p data/normalized
          cp -r build/normalized/vacancy data/normalized/

      - name: "Save the vacancy data in the repository"
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/vacancy
          if git diff --cached --quiet; then
            echo "Vacancy data unchanged."
          else
            git commit -m "Update vacancy tables"
            git pull --rebase origin main
            git push
          fi

      - name: "Keep the report with this run"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vacancy-report
          path: build/normalized/vacancy/vacancy_report.json
          if-no-files-found: ignore
