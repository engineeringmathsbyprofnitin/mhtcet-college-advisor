name: Discover official sources

# Looks at the official CET Cell pages, finds this year's and previous years' engineering CAP documents,
# decides the current admission year and checks that the files can be opened. It does NOT download or read the documents yet.
# Run it by hand: Actions tab -> "Discover official sources" -> Run workflow. It also runs once a week.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"      # Mondays 03:17 UTC (about 08:47 in India)

permissions:
  contents: write              # needed only to save the report file into data/raw/discovery

concurrency:
  group: discover-sources
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "Self-tests (offline, no website is contacted)"
        run: python -m unittest tests/test_stage7_year.py tests/test_stage7_classify.py tests/test_stage7_discover.py

      - name: "Discover sources (polite - robots.txt obeyed, about 1 request per second)"
        run: python -m ingestion.discover --out data/raw/discovery --github-summary

      - name: "Save the report in the repository"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/discovery
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "Update source discovery report"
            git push
          fi

      - name: "Keep a copy of the report with this run"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: discovery-report
          path: data/raw/discovery
          if-no-files-found: ignore
