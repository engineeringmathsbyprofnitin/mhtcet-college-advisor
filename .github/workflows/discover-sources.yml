name: Discover official sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: discover-sources
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Self-tests (offline, no website is contacted)"
        run: python -m unittest tests/test_stage7_year.py tests/test_stage7_classify.py tests/test_stage7_discover.py

      - name: "Discover sources (polite - robots.txt obeyed, about 1 request per second)"
        run: python -m ingestion.discover --out data/raw/discovery

      - name: "Save the report in the repository"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/discovery
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "Update source discovery report"
            git push
          fi

      - name: "Keep a copy of the report with this run"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-report
          path: data/raw/discovery
          if-no-files-found: ignore
